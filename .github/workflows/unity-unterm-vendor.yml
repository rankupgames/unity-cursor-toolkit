name: Unity-Unterm Vendor

on:
  pull_request:
    branches: [main, 'release-0.7-unity-runtime-rework']
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: unity-unterm-vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Verify age-gated npm
        run: |
          node -e "const version=process.version.slice(1); if(version!=='26.4.0') throw new Error('Unexpected Node version: '+version)"
          node -e "const version=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(version[0]<11 || (version[0]===11 && (version[1]<14 || (version[1]===14 && version[2]<1)))) throw new Error('npm 11.14.1 or newer is required')"
          test "$(npm config get min-release-age)" = "7"

      - run: npm ci
      - run: npm run validate

      - name: Verify fork artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit="$(node -p "require('../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/VENDOR.json').sourceCommit")"
          source_ref="$(node -p "require('../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/VENDOR.json').sourceRef")"
          verify_attestation() {
            gh attestation verify "$1" \
              --repo rankupgames/Unity-Unterm \
              --signer-workflow rankupgames/Unity-Unterm/.github/workflows/split-upm.yml \
              --source-digest "$source_commit" \
              --source-ref "$source_ref" \
              --deny-self-hosted-runners
          }
          verify_attestation ../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/Plugins/macOS/unterm.dylib
          verify_attestation ../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/Plugins/macOS/unterm-debugger
          verify_attestation ../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/Plugins/Windows/x86_64/unterm.dll
          verify_attestation ../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/Plugins/Windows/x86_64/unterm-debugger.exe
          verify_attestation "../Packages/com.rankupgames.unity-cursor-toolkit/Editor/ThirdParty/Unity-Unterm/Third Party Notices.md"

  unity-6000-macos-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: vendor-integrity
    runs-on:
      group: 'Unity Toolkit Runtime'
      labels: [self-hosted, macOS, ARM64, unity-macos-runtime]
    concurrency:
      group: unity-runtime-macos
      queue: max
      cancel-in-progress: false
    environment: unity-ci
    env:
      UNITY_CURSOR_TOOLKIT_UNITY_PATH: ${{ vars.UNITY_6000_3_9F1_MAC_EDITOR_PATH }}
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Require activated Unity 6000.3.9f1 host
        run: |
          if [[ -z "$UNITY_CURSOR_TOOLKIT_UNITY_PATH" || ! -x "$UNITY_CURSOR_TOOLKIT_UNITY_PATH" ]]; then
            echo "::error::UNITY_6000_3_9F1_MAC_EDITOR_PATH must point to an installed, activated Unity Editor."
            exit 1
          fi
          unity_contents="$(dirname "$(dirname "$UNITY_CURSOR_TOOLKIT_UNITY_PATH")")"
          required_version="$(node -p "require('./capability-matrix.json').ci.include.find(entry => entry.id === process.env.GITHUB_JOB).editorVersion")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$unity_contents/Info.plist")"
          if [[ "$version" != "$required_version" ]]; then
            echo "::error::Unity Editor version is $version; $required_version is required."
            exit 1
          fi
          unity_process_status=0
          pgrep -f '(^|/)[U]nity\.app/Contents/MacOS/Unity([[:space:]]|$)' > /dev/null || unity_process_status=$?
          if [[ "$unity_process_status" -ne 1 ]]; then
            echo "::error::An existing Unity Editor is running or its process status cannot be verified. Leave it open and run this check after normal save and quit."
            exit 1
          fi

      - name: Verify age-gated npm
        run: |
          node -e "const version=process.version.slice(1); if(version!=='26.4.0') throw new Error('Unexpected Node version: '+version)"
          node -e "const version=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number); if(version[0]<11 || (version[0]===11 && (version[1]<14 || (version[1]===14 && version[2]<1)))) throw new Error('npm 11.14.1 or newer is required')"
          test "$(npm config get min-release-age)" = "7"

      - run: npm ci
      - run: npm run compile

      - name: Run Unity 6000.3 internal smoke
        run: npm run test:unity-internal

  unity-6000-windows-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: vendor-integrity
    runs-on: [self-hosted, Windows, dev-3, unity-windows-runtime]
    concurrency:
      group: unity-runtime-dev3
      queue: max
      cancel-in-progress: false
    environment: unity-ci
    env:
      UNITY_CURSOR_TOOLKIT_UNITY_PATH: ${{ vars.UNITY_6000_3_9F1_WINDOWS_EDITOR_PATH }}
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Require activated Unity 6000.3.9f1 host
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_CURSOR_TOOLKIT_UNITY_PATH) -or -not (Test-Path -LiteralPath $env:UNITY_CURSOR_TOOLKIT_UNITY_PATH -PathType Leaf)) { throw 'UNITY_6000_3_9F1_WINDOWS_EDITOR_PATH must point to an installed, activated Unity Editor' }
          $version = (Get-Item -LiteralPath $env:UNITY_CURSOR_TOOLKIT_UNITY_PATH).VersionInfo.ProductVersion
          $requiredVersion = ((Get-Content -Raw -LiteralPath './capability-matrix.json' | ConvertFrom-Json).ci.include | Where-Object { $_.id -eq $env:GITHUB_JOB }).editorVersion
          if ([string]::IsNullOrWhiteSpace($requiredVersion)) { throw 'The configured CI Editor version is missing' }
          if ($version -ne "${requiredVersion}_7a9955a4f2fa") { throw "Unity Editor version is $version; ${requiredVersion}_7a9955a4f2fa is required" }
          $unityProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'Unity.exe'")
          if ($unityProcesses | Where-Object { [string]::IsNullOrWhiteSpace($_.ExecutablePath) -or $_.ExecutablePath -match '[\\/]Editor[\\/]Unity\.exe$' }) { throw 'An existing Unity Editor is running or its path cannot be verified. Leave it open and run this check after normal save and quit' }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Verify age-gated npm
        shell: powershell
        run: |
          if ((node --version).Trim() -ne 'v26.4.0') { throw 'Unexpected Node version' }
          if ([Version](npm --version) -lt [Version]'11.14.1') { throw 'npm 11.14.1 or newer is required' }
          if ((npm config get min-release-age).Trim() -ne '7') { throw 'npm min-release-age=7 is required' }

      - run: npm ci
      - run: npm run compile

      - name: Run Unity 6000.3 internal smoke
        run: npm run test:unity-internal

  unity-2019-windows-exclusion:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: vendor-integrity
    runs-on: [self-hosted, Windows, dev-3, unity-windows-runtime]
    concurrency:
      group: unity-runtime-dev3
      queue: max
      cancel-in-progress: false
    environment: unity-ci
    env:
      UNITY_LEGACY_PATH: ${{ vars.UNITY_2019_4_40F1_WINDOWS_EDITOR_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Require activated Unity 2019.4.40f1 host
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_LEGACY_PATH) -or -not (Test-Path -LiteralPath $env:UNITY_LEGACY_PATH -PathType Leaf)) { throw 'UNITY_2019_4_40F1_WINDOWS_EDITOR_PATH must point to an installed, activated Unity Editor' }
          $version = (Get-Item -LiteralPath $env:UNITY_LEGACY_PATH).VersionInfo.ProductVersion
          $matrixPath = Join-Path $env:GITHUB_WORKSPACE 'unity-cursor-toolkit/capability-matrix.json'
          $requiredVersion = ((Get-Content -Raw -LiteralPath $matrixPath | ConvertFrom-Json).ci.include | Where-Object { $_.id -eq $env:GITHUB_JOB }).editorVersion
          if ([string]::IsNullOrWhiteSpace($requiredVersion)) { throw 'The configured CI Editor version is missing' }
          if ($version -ne "${requiredVersion}_ffc62b691db5") { throw "Unity Editor version is $version; ${requiredVersion}_ffc62b691db5 is required" }
          $unityProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'Unity.exe'")
          if ($unityProcesses | Where-Object { [string]::IsNullOrWhiteSpace($_.ExecutablePath) -or $_.ExecutablePath -match '[\\/]Editor[\\/]Unity\.exe$' }) { throw 'An existing Unity Editor is running or its path cannot be verified. Leave it open and run this check after normal save and quit' }

      - name: Create Unity 2019 package compatibility project
        shell: powershell
        run: |
          $matrixPath = Join-Path $env:GITHUB_WORKSPACE 'unity-cursor-toolkit/capability-matrix.json'
          $requiredVersion = ((Get-Content -Raw -LiteralPath $matrixPath | ConvertFrom-Json).ci.include | Where-Object { $_.id -eq $env:GITHUB_JOB }).editorVersion
          $projectPath = Join-Path $env:RUNNER_TEMP 'unity-2019-vendor-exclusion'
          $assetsPath = Join-Path $projectPath 'Assets\Editor'
          $packagesPath = Join-Path $projectPath 'Packages'
          $embeddedPackagePath = Join-Path $packagesPath 'com.rankupgames.unity-cursor-toolkit'
          New-Item -ItemType Directory -Force $assetsPath, $embeddedPackagePath, (Join-Path $projectPath 'ProjectSettings') | Out-Null
          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'Packages\com.rankupgames.unity-cursor-toolkit\*') $embeddedPackagePath
          '{"dependencies":{"com.rankupgames.unity-cursor-toolkit":"file:com.rankupgames.unity-cursor-toolkit"}}' | Set-Content -Encoding utf8 (Join-Path $packagesPath 'manifest.json')
          "m_EditorVersion: $requiredVersion`nm_EditorVersionWithRevision: $requiredVersion (ffc62b691db5)" | Set-Content -Encoding utf8 (Join-Path $projectPath 'ProjectSettings\ProjectVersion.txt')
          @'
          using System;
          using UnityEditor;
          using UnityEditor.Compilation;

          public static class LegacyVendorExclusionSmoke
          {
              public static void Run()
              {
                  bool toolkitFound = false;
                  bool vendorFound = false;
                  Assembly[] assemblies = CompilationPipeline.GetAssemblies();
                  foreach (Assembly assembly in assemblies)
                  {
                      toolkitFound |= assembly.name == "UnityCursorToolkit.Editor";
                      vendorFound |= assembly.name == "UnityCursorToolkit.Vendor.Unterm.Editor";
                  }

                  if (toolkitFound == false)
                  {
                      throw new InvalidOperationException("Unity Cursor Toolkit Editor assembly did not compile.");
                  }

                  if (vendorFound)
                  {
                      throw new InvalidOperationException("Unity-Unterm vendor assembly must be excluded before Unity 6000.3.");
                  }

                  EditorApplication.Exit(0);
              }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $assetsPath 'LegacyVendorExclusionSmoke.cs')
          "UNITY_LEGACY_SMOKE_PROJECT=$projectPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Unity 2019.4 vendor exclusion
        shell: powershell
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'unity-2019-smoke.log'
          $smokeProcess = Start-Process -FilePath $env:UNITY_LEGACY_PATH -ArgumentList '-quit','-batchmode','-nographics','-projectPath',$env:UNITY_LEGACY_SMOKE_PROJECT,'-executeMethod','LegacyVendorExclusionSmoke.Run','-logFile',$logPath -PassThru -Wait
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Unity 2019.4 compatibility smoke failed with exit code $($smokeProcess.ExitCode)"
          }

  unity-runtime-gate:
    name: Unity runtime gate
    if: always()
    needs: [vendor-integrity, unity-6000-macos-smoke, unity-6000-windows-smoke, unity-2019-windows-exclusion]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Unity checks to pass
        env:
          VENDOR_INTEGRITY: ${{ needs.vendor-integrity.result }}
          UNITY_6000_MACOS: ${{ needs.unity-6000-macos-smoke.result }}
          UNITY_6000_WINDOWS: ${{ needs.unity-6000-windows-smoke.result }}
          UNITY_2019_WINDOWS: ${{ needs.unity-2019-windows-exclusion.result }}
        run: |
          failed=0
          for check in VENDOR_INTEGRITY UNITY_6000_MACOS UNITY_6000_WINDOWS UNITY_2019_WINDOWS; do
            result="${!check}"
            if [[ "$result" != success ]]; then
              echo "::error::$check result was $result; success is required."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Fork pull requests require a runtime run from a trusted branch in this repository."
            exit 1
          fi
