name: Extension Build

on:
  push:
    branches: [main, 'Version-*']
  pull_request:
    branches: [main, 'Version-*']
  schedule:
    - cron: '0 11 * * 5'  # Friday 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Compute version
        id: version
        run: |
          case "$GITHUB_RUN_NUMBER" in
            ''|0*|*[!0-9]*)
              echo "::error::A positive GitHub run number is required"
              exit 1
              ;;
          esac
          BUILD_VERSION="0.8.${GITHUB_RUN_NUMBER}"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${BUILD_VERSION}"

  build:
    needs: check-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        run: |
          npm install -g npm@11.14.1
          npm --version

      - name: Lint workflows
        working-directory: .
        run: npx --yes github-actionlint@1.7.12 .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/unity-unterm-vendor.yml

      - name: Stamp version
        run: |
          VERSION="${{ needs.check-changes.outputs.build_version }}"
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Stamped package.json -> ${VERSION}"

      - run: npm ci

      - name: Validate extension
        run: npm run validate

      - name: Validate UPM package
        run: |
          UPM_PKG="../Packages/com.rankupgames.unity-cursor-toolkit/package.json"
          if [ ! -f "$UPM_PKG" ]; then
            echo "::error::UPM package.json not found at $UPM_PKG"
            exit 1
          fi
          node -e "
            const pkg = require('$UPM_PKG');
            const missing = [];
            if (!pkg.name) missing.push('name');
            if (!pkg.version) missing.push('version');
            if (!pkg.unity) missing.push('unity');
            if (missing.length > 0) {
              console.error('UPM package.json missing required fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('UPM package valid:', pkg.name, pkg.version, '(unity >=', pkg.unity + ')');
          "

      - name: Check sample package sync
        run: npm run sync:package -- --check

      - name: Package VS Code Marketplace VSIX
        run: |
          VERSION="${{ needs.check-changes.outputs.build_version }}"
          mkdir -p dist/vscode
          npx vsce package --no-dependencies --out "dist/vscode/unity-cursor-toolkit-vscode-${VERSION}.vsix"

      - name: Package OpenVSX VSIX
        run: |
          VERSION="${{ needs.check-changes.outputs.build_version }}"
          mkdir -p dist/openvsx
          npx vsce package --no-dependencies --out "dist/openvsx/unity-cursor-toolkit-openvsx-${VERSION}.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-${{ needs.check-changes.outputs.build_version }}
          path: unity-cursor-toolkit/dist/vscode/*.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: openvsx-extension-${{ needs.check-changes.outputs.build_version }}
          path: unity-cursor-toolkit/dist/openvsx/*.vsix

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Extension Build Summary"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ needs.check-changes.outputs.build_version }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| VS Code Artifact | \`vscode-extension-${{ needs.check-changes.outputs.build_version }}\` |"
            echo "| OpenVSX Artifact | \`openvsx-extension-${{ needs.check-changes.outputs.build_version }}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-openvsx:
    environment:
      name: release-approval
    needs: [check-changes, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6

      - name: Require OpenVSX token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is required to publish the OpenVSX package"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        run: |
          npm install -g npm@11.14.1
          npm --version

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: openvsx-extension-${{ needs.check-changes.outputs.build_version }}
          path: unity-cursor-toolkit/dist/openvsx

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          VSIX_FILES=(dist/openvsx/*.vsix)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one OpenVSX VSIX artifact is required"
            exit 1
          fi
          VSIX_FILE=${VSIX_FILES[0]}
          npx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT"

      - name: OpenVSX summary
        if: always()
        run: echo "| OpenVSX \`${{ needs.check-changes.outputs.build_version }}\` | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  # VS Code Marketplace is best-effort: a publish failure is reported but does not fail the run.
  publish-vscode:
    environment:
      name: release-approval
    needs: [check-changes, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        run: |
          npm install -g npm@11.14.1
          npm --version

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension-${{ needs.check-changes.outputs.build_version }}
          path: unity-cursor-toolkit/dist/vscode

      - name: Publish to VS Code Marketplace
        id: publish
        run: |
          shopt -s nullglob
          VSIX_FILES=(dist/vscode/*.vsix)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one VS Code Marketplace VSIX artifact is required"
            exit 1
          fi
          VSIX_FILE=${VSIX_FILES[0]}
          npx --no-install vsce publish --oidc --packagePath "$VSIX_FILE"

      - name: VS Code Marketplace summary
        if: always()
        run: |
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            RESULT="published"
          else
            RESULT="failed"
            echo "::warning::VS Code Marketplace publish failed. OpenVSX is unaffected."
          fi
          echo "| VS Code Marketplace \`${{ needs.check-changes.outputs.build_version }}\` | ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
