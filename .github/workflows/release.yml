name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upm_version: ${{ steps.upm.outputs.upm_version }}
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        run: |
          npm install -g npm@11.14.1
          npm --version

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Read UPM version
        id: upm
        run: |
          UPM_PKG="../Packages/com.rankupgames.unity-cursor-toolkit/package.json"
          UPM_VERSION=$(node -e "console.log(require('${UPM_PKG}').version)")
          echo "upm_version=${UPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "UPM package version: ${UPM_VERSION}"

      - name: Stamp extension version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: npm ci

      - name: Validate extension
        run: npm run validate

      - name: Package VS Code Marketplace VSIX
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/vscode
          npx vsce package --no-dependencies --out "dist/vscode/unity-cursor-toolkit-vscode-${VERSION}.vsix"

      - name: Package OpenVSX VSIX
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/openvsx
          npx vsce package --no-dependencies --out "dist/openvsx/unity-cursor-toolkit-openvsx-${VERSION}.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-release-${{ steps.version.outputs.version }}
          path: unity-cursor-toolkit/dist/vscode/*.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: openvsx-release-${{ steps.version.outputs.version }}
          path: unity-cursor-toolkit/dist/openvsx/*.vsix

  github-release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vscode-release-${{ needs.build.outputs.version }}
          path: dist/vscode

      - uses: actions/download-artifact@v8
        with:
          name: openvsx-release-${{ needs.build.outputs.version }}
          path: dist/openvsx

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          UPM_VERSION="${{ needs.build.outputs.upm_version }}"
          shopt -s nullglob
          VSCODE_VSIX_FILES=(dist/vscode/*.vsix)
          OPENVSX_VSIX_FILES=(dist/openvsx/*.vsix)
          if [ "${#VSCODE_VSIX_FILES[@]}" -ne 1 ] || [ "${#OPENVSX_VSIX_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one VSIX artifact per marketplace is required"
            exit 1
          fi
          VSCODE_VSIX=${VSCODE_VSIX_FILES[0]}
          OPENVSX_VSIX=${OPENVSX_VSIX_FILES[0]}
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          REPO="${{ github.repository }}"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOFNOTES
          ## Unity Cursor Toolkit v${VERSION}

          | Field | Value |
          |-------|-------|
          | Extension | \`${VERSION}\` |
          | UPM Package | \`${UPM_VERSION}\` |
          | Commit | \`${COMMIT_SHORT}\` |

          ### Cursor/VS Code Extension
          Download the \`.vsix\` below or install from the marketplace.

          ### Unity Package (UPM)
          \`\`\`
          openupm add com.rankupgames.unity-cursor-toolkit
          \`\`\`
          Or add via git URL in Unity Package Manager:
          \`\`\`
          https://github.com/${REPO}.git?path=Packages/com.rankupgames.unity-cursor-toolkit#v${VERSION}
          \`\`\`
          EOFNOTES

          gh release create "v${VERSION}" \
            --repo "${REPO}" \
            --title "Unity Cursor Toolkit v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${VSCODE_VSIX}" \
            "${OPENVSX_VSIX}"
          echo "| GitHub Release | \`v${VERSION}\` created |" >> "$GITHUB_STEP_SUMMARY"

  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: read
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6

      - name: Require OpenVSX token
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is required to publish the OpenVSX package"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        run: |
          npm install -g npm@11.14.1
          npm --version

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: openvsx-release-${{ needs.build.outputs.version }}
          path: unity-cursor-toolkit/dist/openvsx

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          VSIX_FILES=(dist/openvsx/*.vsix)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one OpenVSX VSIX artifact is required"
            exit 1
          fi
          VSIX_FILE=${VSIX_FILES[0]}
          npx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT"

      - name: OpenVSX summary
        if: always()
        run: echo "| OpenVSX | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  # VS Code Marketplace is best-effort: a missing token or publish failure is reported but does not fail the release.
  publish-vscode:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: release-approval
    permissions:
      contents: read
    defaults:
      run:
        working-directory: unity-cursor-toolkit
    steps:
      - uses: actions/checkout@v6

      - name: Check VS Code Marketplace token
        id: token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VSCE_PAT is unavailable. VS Code Marketplace publish skipped."
          fi

      - uses: actions/setup-node@v6
        if: steps.token.outputs.available == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: unity-cursor-toolkit/package-lock.json

      - name: Use npm 11.14.1
        if: steps.token.outputs.available == 'true'
        run: |
          npm install -g npm@11.14.1
          npm --version

      - if: steps.token.outputs.available == 'true'
        run: npm ci

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.available == 'true'
        with:
          name: vscode-release-${{ needs.build.outputs.version }}
          path: unity-cursor-toolkit/dist/vscode

      - name: Publish to VS Code Marketplace
        id: publish
        if: steps.token.outputs.available == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          VSIX_FILES=(dist/vscode/*.vsix)
          if [ "${#VSIX_FILES[@]}" -ne 1 ]; then
            echo "::error::Exactly one VS Code Marketplace VSIX artifact is required"
            exit 1
          fi
          VSIX_FILE=${VSIX_FILES[0]}
          npx vsce publish --packagePath "$VSIX_FILE"

      - name: VS Code Marketplace summary
        if: always()
        run: |
          if [ "${{ steps.token.outputs.available }}" != "true" ]; then
            RESULT="skipped (VSCE_PAT unavailable)"
          elif [ "${{ steps.publish.outcome }}" = "success" ]; then
            RESULT="published"
          else
            RESULT="failed"
            echo "::warning::VS Code Marketplace publish failed. Other release lanes are unaffected."
          fi
          echo "| VS Code Marketplace | ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
